server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # cabeceras de seguridad · security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; font-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # solo rutas reales: lo que no existe devuelve 404 (no SPA fallback)
    location / {
        try_files $uri $uri/ =404;
    }

    # el html y el js cambian con cada despliegue: revalidar siempre.
    # OJO: se usa `expires` y no add_header — un add_header propio aquí
    # anularía la herencia de las cabeceras de seguridad del server.
    location ~* \.(js|css|html)$ {
        expires -1;
        try_files $uri =404;
    }

    # assets inmutables: sí pueden ir con caché larga
    location ~* \.(png|jpg|jpeg|svg|ico|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }
}
