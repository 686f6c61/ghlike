server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # la plantilla og.html no se publica
    location = /og.html { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # el html y el widget cambian con cada despliegue: revalidar siempre
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # assets inmutables: sí pueden ir con caché larga
    location ~* \.(png|jpg|jpeg|svg|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
